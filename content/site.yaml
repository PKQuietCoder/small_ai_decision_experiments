about: |
  We like to think we reason our way to decisions. Decades of research says otherwise.
  Mostly we follow hidden rules, and those rules are predictable and often counterintuitive.
  A number you saw first drags the next one toward it. The way a question is framed flips
  the answer. Naming a budget makes you spend more, not less.

  Today we're handing more of those decisions to language models, and to agents that decide
  over several steps. Here's the catch: we don't actually know what rules they follow. Some
  they may inherit from us, soaked up from a training set full of human choices. Some they
  may invent on their own.

  In each entry I take one classic human-bias experiment and rerun it live, not just as a
  single chat answer but as an agent that reaches the decision over several tool-using steps,
  including a condition where the agent directs itself. Then I ask a simple question: does the
  model copy our bias, smooth it out, or make it worse?

  ### How to read these results: copy, smooth, amplify

  Three words carry the verdict of every entry, always measured against the original study's
  human baseline:

  - **Copy:** the model reproduces the human bias at a comparable size.
  - **Smooth:** the model damps the bias toward noise, or removes it entirely.
  - **Amplify:** the model shows the bias more strongly than people do.

  ### Why this matters

  Humans have always offloaded work to tools, and AI is another one. To use it well we need
  to understand both our own skills and our biases, so we can work together, leveraging each
  other's strengths and cancelling out our biases.

  ### Open data and code

  No findings here are absolute. In science there is a term for that: boundary conditions.
  Critique, useful feedback, and extensions of these experiments are all encouraged. To make
  that possible, everything lives in the project's GitHub repository: the prompts, the
  per-trial data, the analysis code, the charts, the articles themselves, and the setup for
  running the entire project on Replit.
