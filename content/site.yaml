description: >
  A running series of decision-science experiments on large language models.
  Each post takes a single, controlled question — change one variable, hold
  everything else constant — and measures how it moves a model's choices.
author: "The LLM Decision Science Lab"
about: |
  ## About this project

  For decades, scientists studying how people make decisions have uncovered something
  counterintuitive: human judgment is shaped by hidden, systematic biases — predictable
  ways our choices bend depending on how a question is framed. There is a deep,
  well-established body of research documenting these effects.

  This project asks whether AI does the same thing. We take those classic human studies
  as our baseline, replicate them as simple experiments on large language models, and
  then extend them to AI agents that make decisions over multiple steps.

  ### What we're looking for

  Each time, we ask one straightforward question: do these systems repeat the same human
  biases, smooth them out, or amplify them? The goal isn't to rank models — it's to build
  an intuitive picture of how LLMs and agents actually make decisions, and how those
  tendencies could compound when models work together.

  ### How we talk about results

  We still run proper A/B tests and check whether our results are statistically solid. But
  we report what we find in plain, intuitive language instead of technical terms — so the
  findings are easy to understand and act on.
