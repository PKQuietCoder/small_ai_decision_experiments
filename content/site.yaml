description: >
  We take established, peer-reviewed experiments from decision science and behavioral
  science, the ones first run on people, and rerun them on language models and agents to
  see what carries over and what breaks. The point isn't to rank models. It's to learn
  when humans and AI working together amplify a cognitive bias, smooth it out, or cancel
  it.
author: "P.K. Mishra"
about: |
  We've known for decades how human judgment actually works. Framing effects. Anchoring.
  The way naming a budget quietly changes what you buy. This notebook puts each of those
  findings to a new test. Run the same study on a language model or an agent, then watch
  what happens. Does the bias show up? Fade? Flip?

  Each entry starts from a real, peer-reviewed study and reruns it faithfully. Hold the
  scenario steady, change one thing, run it many times, report what the data says in plain
  words. Then the part you can actually use: a few concrete tips on when to trust a model
  with a decision, when to keep a human in the loop, and when the pair beats either one
  alone.

  ### How entries are tagged

  Two small tag sets. One says what an entry is about. The other says how we went at it.

  What it's about, pick one:

  - **Decisions.** Judgment and choice. Classic decision-science and behavioral studies,
    rerun on models and agents, watching how their picks bend when we change the framing
    instead of the facts.
  - **Science.** The bar we hold ourselves to: controlled comparisons, honest statistics,
    plain language. A few entries reach into broader reasoning and scientific judgment too.
  - **Creativity.** The open-ended work, where no answer is the right one. Writing, ideas,
    the texture of a model's voice.

  How we went at it, pick one:

  - **Experiments.** A faithful replication of one specific published study.
  - **Methods.** A technique or measurement approach instead of a single experiment.

  ### Open data and code

  Everything's in the open. Prompts, per-trial data, analysis code, the charts. It all
  lives in the project's GitHub repository. Check the work. Disagree with a coding call.
  Rerun it on a model I never touched.

  ### One person, so replicate me

  This is a solo project, and solo projects have bugs. A prompt that leaks a cue. A judge
  that miscodes a borderline answer. A p-value read too kindly. Independent replication
  isn't a courtesy here. It's the method. Rerun an entry and get a different number? Tell
  me. Spot a flaw? Even better. I'd rather be corrected than stay wrong.
