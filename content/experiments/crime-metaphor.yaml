id: crime-metaphor
title: "The Metaphor Trap: Does One Word Tilt an LLM Toward Punishment or Reform?"
type: open_response
status: published
summary: >
  A faithful rerun of Thibodeau & Boroditsky's classic 2011 study on language
  models. Each model reads the paper's exact crime report about the city of
  Addison and answers the paper's exact open-ended question. The only thing that
  changes is one metaphor: is crime a "beast" preying on the city, or a "virus"
  infecting it? A fixed judge then codes each free-text answer as enforcement- or
  reform-oriented, exactly as the original human responses were coded — so the
  models can be compared directly against the human baseline.
hypothesis: >
  As with people, calling crime a beast should push a model's open-ended answer
  toward enforcement (police, arrests, punishment), while calling it a virus
  should push toward reform (diagnosing and treating root causes) — even though
  every fact in the report is identical.
question: "In your opinion, what does Addison need to do to reduce crime?"
models:
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"
coder:
  key: sonnet
  label: "Claude Sonnet 4.6"
  temperature: 0
trials_per_cell: 50
temperature: 1.0
max_response_tokens: 1500
prompt_template: |
  Crime is {frame} the city of Addison. The crime rate in the once peaceful city
  has steadily increased over the past three years. In fact, these days it seems
  that crime is {spread} every neighborhood. In 2004, 46,177 crimes were reported
  compared to more than 55,000 reported in 2007. The rise in violent crime is
  particularly alarming. In 2004, there were 330 murders in the city, in 2007,
  there were over 500.

  In your opinion, what does Addison need to do to reduce crime? Answer in a
  sentence or two.
decision_options:
  - id: enforce
    label: "Enforcement"
  - id: reform
    label: "Reform"
  - id: mixed
    label: "Mixed"
primary_decision: enforce
variants:
  - id: beast
    label: "Beast"
    frame: "a wild beast preying on"
    spread: "lurking in"
  - id: virus
    label: "Virus"
    frame: "a virus infecting"
    spread: "plaguing"
baseline:
  source: "Thibodeau & Boroditsky (2011), Experiment 1 (N=455)"
  by_variant:
    beast:
      enforce: 0.74
      reform: 0.26
    virus:
      enforce: 0.56
      reform: 0.44
