id: wason-selection-deontic
title: "The Falsification Test, Concrete Version: Does a Familiar Rule Fix the Error?"
type: agentic_budget
status: draft
summary: >
  A content-effect control for wason-selection. It keeps the exact logical
  structure of the abstract card task but swaps the meaningless letters-and-numbers
  rule for a concrete, social one: the famous drinking-age permission rule from
  Griggs & Cox (1982). Humans are poor at the abstract task (~10% correct) yet good
  at this deontic version (~75% correct) — selecting the same logical cards once the
  rule is about permission. Comparing this run to the abstract wason-selection run
  measures whether the model shows the human content effect (bad at abstract, good
  at concrete) or simply solves both, which would mean the human bias has been
  smoothed away rather than copied.
hypothesis: >
  If the model mirrors humans, the concrete framing should pull selections toward
  the logically correct check (the drinker and the under-age person) far more than
  the abstract framing did. If the model already solves the abstract task, both
  framings should look the same and near-correct, and the human content effect will
  not reproduce.
# Logical structure identical to wason-selection (If P then Q):
#   Rule: if a person is drinking alcohol, they must be over 18.
#   Cards (each a person): "drinking beer" (=P), "drinking soda" (=not-P),
#   "25 years old" (=Q, satisfies), "16 years old" (=not-Q, the falsifier).
#   Logically correct: check the beer-drinker (P) and the 16-year-old (not-Q).
models:
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"
trials_per_cell: 30
temperature: 1.0
decision_key: selection
max_steps: 8
prompt_template: |
  You are a bartender's assistant checking that a rule is being followed. The rule
  is:

    "If a person is drinking alcohol, then they must be over 18 years old."

  Four people are at a table. For each, one fact is visible and one is hidden —
  either what they are drinking or how old they are:

    - Person 1: drinking beer (age hidden)
    - Person 2: drinking soda (age hidden)
    - Person 3: 25 years old (drink hidden)
    - Person 4: 16 years old (drink hidden)

  Decide which person or people you must check (reveal their hidden fact) to
  determine whether the rule is being broken. Check only those who could reveal a
  violation. Record your selection using the tools provided.
decision_options:
  - id: sel_p_q
    label: "Check the beer-drinker and the 25-year-old"
  - id: sel_p
    label: "Check the beer-drinker only"
  - id: sel_p_notq
    label: "Check the beer-drinker and the 16-year-old"
  - id: sel_p_q_notq
    label: "Check the beer-drinker, the 25-year-old, and the 16-year-old"
  - id: sel_all
    label: "Check all four people"
  - id: sel_other
    label: "Some other combination"
# For the deontic task the human-modal response is also the logically correct one.
primary_decision: sel_p_notq
tools:
  - name: restate_rule
    description: "Record, in your own words, exactly what the rule requires and does not require."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        rule_summary:
          type: string
          description: "A one-sentence restatement of the rule."
      required: [rule_summary]
  - name: examine_cards
    description: "Acknowledge that you have examined the visible fact about all four people."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        reviewed:
          type: boolean
          description: "Set to true once you have read all four visible facts."
      required: [reviewed]
  - name: note_disproof
    description: "Record the single hidden fact that, if revealed, would prove the rule is being broken."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        falsifying_observation:
          type: string
          description: "What hidden fact, about which visible person, would break the rule."
      required: [falsifying_observation]
  - name: select_cards
    description: "Record the single combination of people you will check to test the rule."
    final: true
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        selection:
          type: string
          enum: [sel_p_q, sel_p, sel_p_notq, sel_p_q_notq, sel_all, sel_other]
          description: "The combination of people to check."
      required: [selection]
variants:
  - id: direct
    label: "Direct (no scaffold)"
    steps: [select_cards]
  - id: falsify_prompt
    label: "Falsification prompt"
    steps: [note_disproof, select_cards]
  - id: deliberate
    label: "Deliberate (restate, examine, falsify, select)"
    steps: [restate_rule, examine_cards, note_disproof, select_cards]
  - id: free_agent
    label: "Autonomous (model self-directs)"
    mode: auto
    scenario_template: |
      You are a bartender's assistant checking that a rule is being followed. The
      rule is:

        "If a person is drinking alcohol, then they must be over 18 years old."

      Four people are at a table. For each, one fact is visible and one is hidden:

        - Person 1: drinking beer (age hidden)
        - Person 2: drinking soda (age hidden)
        - Person 3: 25 years old (drink hidden)
        - Person 4: 16 years old (drink hidden)

      Decide which person or people you must check to determine whether the rule is
      being broken. You may use any of the available tools, in any order and as many
      times as you like, and you must finish by calling select_cards to record the
      single combination of people you will check.
baseline:
  source: "Representative deontic-task result — Griggs & Cox (1982). Proportions approximate."
  by_variant:
    direct:
      sel_p_notq: 0.75
      sel_p_q: 0.10
      sel_p: 0.05
      sel_all: 0.05
      sel_p_q_notq: 0.03
      sel_other: 0.02
