id: crime-metaphor-recognition
title: "The Metaphor Trap, Recognition Probe: Does the Model Know the Study?"
type: open_response
status: draft
summary: >
  A direct measurement of the contamination concern behind crime-metaphor.
  Instead of asking the model what to do about crime, it asks the model whether it
  has seen this exact scenario before, what it is testing, and what result it would
  expect. One condition shows the verbatim Thibodeau & Boroditsky stimulus; the
  other shows a disguised paraphrase with a different city and numbers. A custom
  judge rubric codes each answer as recognized, partial, or unrecognized. A high
  recognition rate on the verbatim text — and a low one on the disguise — is direct
  evidence that recognition is in play. See methodology/Limitations.md.
hypothesis: >
  The model will recognize the verbatim canonical stimulus (naming the metaphor-
  framing paradigm and/or the expected beast-more-punitive result) far more often
  than it recognizes the disguised paraphrase. The size of that gap estimates how
  much the main study's flat response could be driven by recognition rather than
  by reasoning over the framing.
question: "Have you seen this exact passage, scenario, or study before? If so, name what it is testing and the result it is known to produce."
models:
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"
coder:
  key: sonnet
  label: "Claude Sonnet 4.6"
  temperature: 0
  categories: [recognized, partial, unrecognized]
  rubric: |
    You are coding an AI model's response to a probe that asked whether it
    recognizes a passage about crime in a city. The passage is, in one condition,
    the verbatim stimulus from Thibodeau & Boroditsky (2011) "Metaphors We Think
    With" (the crime-as-beast / crime-as-virus framing study), and in the other a
    disguised paraphrase of it. Identify how strongly the model signalled
    recognition of the underlying study or task.

    Categories:
    - recognized: clearly identifies the specific study, its authors, the
      metaphor-framing paradigm, OR correctly states the known result (that
      calling crime a "beast" pushes people toward enforcement versus "virus"
      toward reform). Naming the manipulation and its expected direction counts.
    - partial: hedged or generic recognition — says it looks like a framing or
      metaphor-effect experiment, or that the wording seems designed to test
      something, but does not name the study or its specific result.
    - unrecognized: denies having seen it, or treats it as a normal question with
      no sign of recognizing it as a known experiment.

    Judge only by what the response asserts about recognition, not by whether the
    response is well written.
trials_per_cell: 50
temperature: 1.0
max_response_tokens: 1500
prompt_template: |
  Read the following passage, then answer the question below it.

  "Crime is {frame} the city of {city}. {report}"

  Have you seen this exact passage, scenario, or study before? If so, name what it
  is testing and the result it is known to produce. Answer honestly in a sentence
  or two.
decision_options:
  - id: recognized
    label: "Recognized"
  - id: partial
    label: "Partial"
  - id: unrecognized
    label: "Unrecognized"
primary_decision: recognized
variants:
  - id: canonical
    label: "Canonical (verbatim)"
    frame: "a wild beast preying on"
    city: "Addison"
    report: >-
      The crime rate in the once peaceful city has steadily increased over the
      past three years. In fact, these days it seems that crime is lurking in
      every neighborhood. In 2004, 46,177 crimes were reported compared to more
      than 55,000 reported in 2007. The rise in violent crime is particularly
      alarming. In 2004, there were 330 murders in the city, in 2007, there were
      over 500.
  - id: disguised
    label: "Disguised (paraphrase)"
    frame: "a wild beast preying on"
    city: "Marlowe"
    report: >-
      After years of calm, the city has watched its crime rate rise steadily for
      three years running, and lately crime seems to be lurking in every part of
      town. Reported offenses grew from roughly 41,000 in one recent year to over
      52,000 three years later, and the jump in violent crime is the sharpest part
      of the trend: homicides went from about 290 to more than 470.
# No human baseline: recognition is a property of the model, not of the original
# human subjects.
