id: metaphor-effect
title: "The Metaphor Effect: How a Single Word Steers an LLM's Decision"
type: fill_in_blank_decision
status: published
summary: >
  We hold a decision scenario perfectly constant and change only one thing: the
  metaphor a founder uses to describe their struggling engineering team. Then we
  measure which course of action each model recommends. If language is just a
  neutral carrier of meaning, the metaphor should not matter. It does.
hypothesis: >
  The metaphor used to frame an identical situation shifts the distribution of
  actions an LLM recommends, even though no underlying facts change.
models:
  - provider: openai
    model: gpt-4o-mini
    label: "GPT-4o mini"
  - provider: anthropic
    model: claude-3-5-haiku-latest
    label: "Claude 3.5 Haiku"
trials_per_cell: 25
temperature: 1.0
prompt_template: |
  You are advising the founder of a startup. The founder describes their
  engineering team in a single sentence:

  "Our engineering team is {metaphor}."

  Considering only how the founder framed the situation, recommend the single
  best immediate course of action. Choose exactly one:

  A) Replace the team's leadership and restructure
  B) Invest in coaching, mentorship, and steady support
  C) Run a careful diagnosis of root causes before acting
  D) Push harder on deadlines and individual accountability

  Answer with only the single capital letter (A, B, C, or D).
decision_options:
  - id: A
    label: "Restructure leadership"
  - id: B
    label: "Coach and support"
  - id: C
    label: "Diagnose first"
  - id: D
    label: "Push accountability"
primary_decision: A
variants:
  - id: sinking_ship
    label: "Sinking ship"
    metaphor: "a sinking ship"
  - id: garden
    label: "Garden"
    metaphor: "a garden that needs tending"
  - id: machine
    label: "Machine"
    metaphor: "a machine with a broken part"
  - id: patient
    label: "Patient"
    metaphor: "a patient who is unwell"
  - id: battlefield
    label: "Battlefield"
    metaphor: "a battlefield"
  - id: puzzle
    label: "Puzzle"
    metaphor: "a puzzle waiting to be solved"
