about: |
  ## About this notebook

  The Model Notebook is a running record of how large language models and agents behave.
  We keep it in three parts, and every entry on the site is filed under one of them.

  ### Creativity

  What does a model make when the task is open-ended? These entries look at writing,
  ideas, and the texture of a model's voice — where it reaches, where it defaults, and
  how its output shifts when we change the prompt rather than the model.

  ### Experiments

  For decades, researchers studying human judgment have documented hidden, systematic
  biases — predictable ways our choices bend with how a question is framed. We take those
  classic studies as a baseline, replicate them on language models, and extend them to
  agents that decide over multiple steps. Each time we ask one question: do these systems
  repeat the same biases, smooth them out, or amplify them?

  ### Science

  Science is the method, not a separate topic. We run proper A/B comparisons and check
  whether a result is statistically solid before we believe it. But we report what we
  find in plain, intuitive language instead of technical jargon — so the findings are
  easy to understand and act on.
