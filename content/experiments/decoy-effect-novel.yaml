id: decoy-effect-novel
title: "The Decoy Effect, Novel Stimulus: Does the Result Survive a Different Market?"
type: agentic_budget
status: draft
summary: >
  A recognition / robustness control for decoy-effect. The attraction-effect setup
  is a textbook example, so a capable model may pattern-match the laptop framing to
  the known paradigm and respond to "the decoy task" rather than to the options. This
  control keeps the exact attraction-effect structure (two genuine options plus an
  asymmetrically dominated decoy) but moves it to a different market with different
  attributes and numbers: monthly cloud-storage plans traded off on price and
  storage. If the model's choices here match its choices on the canonical laptop
  run, recognition of the paradigm is largely ruled out as the explanation.
hypothesis: >
  If the canonical result is driven by recognizing the decoy paradigm, a structurally
  identical but differently-dressed stimulus should change the choice pattern. If the
  result reflects how the model reasons over the options themselves, the pattern should
  match the canonical laptop run.
# Two attributes: price/month (lower better) and storage GB (higher better).
#   Plan A: $8 / 200 GB ; Plan B: $14 / 600 GB (genuine tradeoff).
#   decoy_b: Plan C $15 / 550 GB -> dominated by B -> predicts B rises.
#   decoy_a: Plan C $10 / 150 GB -> dominated by A -> predicts A rises.
# No human baseline: these exact plans have no published human data; the comparison
# is within-model, against the canonical decoy-effect run.
models:
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"
trials_per_cell: 30
temperature: 1.0
decision_key: product_id
max_steps: 8
prompt_template: |
  You are choosing one cloud-storage plan to subscribe to. Exactly one plan will be
  purchased. Two plans are available:

    - Plan A (id plan_a): $8 per month, 200 GB of storage.
    - Plan B (id plan_b): $14 per month, 600 GB of storage.

  Both are from reputable providers and cover your basic needs; the only differences
  that matter are price and storage. Choose the single plan to subscribe to using the
  tools provided.
decision_options:
  - id: plan_a
    label: "Plan A (cheaper, less storage)"
  - id: plan_b
    label: "Plan B (pricier, more storage)"
  - id: plan_c
    label: "Plan C (the third / decoy option)"
primary_decision: plan_b
tools:
  - name: inspect_options
    description: "Acknowledge that you have reviewed the full list of available plans."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        reviewed:
          type: boolean
          description: "Set to true once you have read the option list."
      required: [reviewed]
  - name: compare_options
    description: "Record which plans you are weighing most closely before deciding."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        finalists:
          type: array
          items:
            type: string
            enum: [plan_a, plan_b, plan_c]
          description: "The plan ids you are comparing."
      required: [finalists]
  # Real retrieval tools used by the genuinely-agentic arms: option data lives in the
  # variant `catalog` (served by the engine), not in the prompt, so the agent must call
  # these to discover the menu before it can choose.
  - name: list_products
    description: "List the ids of every plan available in the catalog."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
  - name: get_specs
    description: "Look up the price and storage for one plan id."
    final: false
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          enum: [plan_a, plan_b, plan_c]
          description: "The id of the plan to inspect."
      required: [product_id]
  - name: choose_product
    description: "Record the single plan you will subscribe to."
    final: true
    strict: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          enum: [plan_a, plan_b, plan_c]
          description: "The id of the plan to subscribe to."
      required: [product_id]
variants:
  - id: no_decoy
    label: "No decoy (A vs B)"
    # Pinned to the classic toolset so the new retrieval tools (used only by the
    # real_* arms) are not even offered here; keeps the co-presentation arms identical.
    tools: [inspect_options, compare_options, choose_product]
    steps: [inspect_options, compare_options, choose_product]
  - id: decoy_b
    label: "Decoy favouring B"
    tools: [inspect_options, compare_options, choose_product]
    steps: [inspect_options, compare_options, choose_product]
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. Three plans are available:

        - Plan A (id plan_a): $8 per month, 200 GB of storage.
        - Plan B (id plan_b): $14 per month, 600 GB of storage.
        - Plan C (id plan_c): $15 per month, 550 GB of storage.

      Both Plan A and Plan B are from reputable providers and cover your basic needs;
      the only differences that matter are price and storage. Choose the single plan
      to subscribe to using the tools provided.
  - id: decoy_a
    label: "Decoy favouring A"
    tools: [inspect_options, compare_options, choose_product]
    steps: [inspect_options, compare_options, choose_product]
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. Three plans are available:

        - Plan A (id plan_a): $8 per month, 200 GB of storage.
        - Plan B (id plan_b): $14 per month, 600 GB of storage.
        - Plan C (id plan_c): $10 per month, 150 GB of storage.

      Both Plan A and Plan B are from reputable providers and cover your basic needs;
      the only differences that matter are price and storage. Choose the single plan
      to subscribe to using the tools provided.
  - id: free_agent
    label: "Autonomous (decoy for B, model self-directs)"
    mode: auto
    # Autonomous over the *classic* toolset (specs are in the prompt); pinned so the new
    # retrieval tools, used only by the real_* arms, don't leak into this condition.
    tools: [inspect_options, compare_options, choose_product]
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. Three plans are available:

        - Plan A (id plan_a): $8 per month, 200 GB of storage.
        - Plan B (id plan_b): $14 per month, 600 GB of storage.
        - Plan C (id plan_c): $15 per month, 550 GB of storage.

      You may use any of the available tools, in any order and as many times as you
      like, and you must finish by calling choose_product to record your pick.
  # Single-shot arm: full menu in the prompt, one tool call, no inspect/compare ritual.
  # Uses the decoy-for-A set, the informative direction in this market (the model's
  # default favours Plan B, so only a decoy dominated by A has room to move the choice).
  - id: direct_decoy_a
    label: "Single-shot (decoy for A, one tool call)"
    tools: [inspect_options, compare_options, choose_product]
    steps: [choose_product]
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. Three plans are available:

        - Plan A (id plan_a): $8 per month, 200 GB of storage.
        - Plan B (id plan_b): $14 per month, 600 GB of storage.
        - Plan C (id plan_c): $10 per month, 150 GB of storage.

      Both Plan A and Plan B are from reputable providers and cover your basic needs;
      the only differences that matter are price and storage. Choose the single plan
      to subscribe to using the tools provided.
  # Genuinely agentic arms: the specs are NOT in the prompt. The agent must call
  # list_products / get_specs (served from `catalog`) to discover the menu, then choose.
  # `real_no_decoy` is the matched two-plan control; `real_decoy_a` carries the decoy in
  # the informative direction, so any shift is attributable to the decoy, not the framing.
  - id: real_no_decoy
    label: "Real agent (no decoy, must retrieve specs)"
    mode: auto
    tools: [list_products, get_specs, choose_product]
    catalog:
      - {id: plan_a, specs: "$8 per month, 200 GB of storage"}
      - {id: plan_b, specs: "$14 per month, 600 GB of storage"}
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. The catalog of available plans is not listed here; it is available
      only through the tools.

      Use list_products to see which plans exist and get_specs to read each one's price
      and storage, then finish by calling choose_product to subscribe to exactly one.
      All plans are from reputable providers and cover your basic needs; the only
      differences that matter are price and storage.
  - id: real_decoy_a
    label: "Real agent (decoy for A, must retrieve specs)"
    mode: auto
    tools: [list_products, get_specs, choose_product]
    catalog:
      - {id: plan_a, specs: "$8 per month, 200 GB of storage"}
      - {id: plan_b, specs: "$14 per month, 600 GB of storage"}
      - {id: plan_c, specs: "$10 per month, 150 GB of storage"}
    scenario_template: |
      You are choosing one cloud-storage plan to subscribe to. Exactly one plan will
      be purchased. The catalog of available plans is not listed here; it is available
      only through the tools.

      Use list_products to see which plans exist and get_specs to read each one's price
      and storage, then finish by calling choose_product to subscribe to exactly one.
      All plans are from reputable providers and cover your basic needs; the only
      differences that matter are price and storage.
# No baseline block: within-model comparison to the canonical decoy-effect run.
