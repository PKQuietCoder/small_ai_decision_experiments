id: decoy-effect
title: "The Decoy Effect: Does a Worse Option Sway a Model's Choice?"
type: fill_in_blank_decision
status: published
summary: >
  A faithful rerun of Huber, Payne & Puto's (1982) attraction-effect study on a
  language model. Subjects in the original chose one product from a small menu in
  six categories (beer, cars, restaurants, lotteries, film, television sets), each
  option described on two attributes. A target and a competitor form a genuine
  tradeoff; a third "decoy" option is asymmetrically dominated — clearly worse than
  the target on both attributes but not worse than the competitor — so it is almost
  never chosen, yet its presence lifts the target's share. We reproduce the exact
  six categories and the paper's four decoy-placement strategies (moderate range R,
  extreme range R*, frequency F, range-frequency RF) and ask the model to pick one
  option, measuring the target's choice share with and without the decoy.
hypothesis: >
  If the model mirrors people, adding an asymmetrically dominated decoy should raise
  the target's choice share relative to the no-decoy menu, even though the decoy is
  almost never chosen. If the model reasons over absolute merit, it should ignore the
  dominated decoy and its target-versus-competitor split should not move.
# Each option is described on two attributes (5 = best on the paper's level scale).
# Placement (verified against Table 1, beer): Target = (D1 best, D2 mid); Competitor =
# (D1 mid, D2 best); decoys sit beside the target and are dominated by it, never by the
# competitor — R=(D1 best, D2 low), R*=(D1 best, D2 lowest), F=(D1 mid-high, D2 mid),
# RF=(D1 mid-high, D2 low). Attribute values are the paper's Appendix II scales.
# Option 1 is always the target, Option 2 the competitor, Option 3 the decoy; the model
# only ever sees option_1/2/3 plus each option's two attributes (the role words never
# appear in the prompt or the choice enum).
models:
  - provider: anthropic
    model: claude-opus-4-8
    label: "Claude Opus 4.8"
trials_per_cell: 30
temperature: 1.0
decision_options:
  - id: option_1
    label: "Target"
  - id: option_2
    label: "Competitor"
  - id: option_3
    label: "Decoy"
primary_decision: option_1
prompt_template: |
  {scenario}
variants:
