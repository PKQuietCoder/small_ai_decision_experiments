id: decoy-effect-agentic
title: 'The Decoy Effect Under Agentic Scaffolds: Does How an Agent Deliberates Change the Bias?'
type: agentic_budget
status: draft
summary: 'An agentic extension of the faithful decoy-effect replication. The paper''s attraction-effect
  choice (target / competitor / asymmetrically dominated decoy, four placement strategies) is held fixed
  for three categories (film, cars, television sets) and crossed with how the choice is staged: a single
  tool call, a forced inspect-compare-choose workflow, fully autonomous tool use, and a retrieval arm
  where the agent must look up each option''s specs through tools rather than reading a menu. It tests
  whether the placement signature (range decoys raise the target; Opus''s frequency reversal) survives
  more deliberation or a different presentation.'
hypothesis: If the decoy effect lives in the side-by-side comparison, single-shot and forced-workflow
  arms should match, autonomy should not reliably change it, and requiring the agent to retrieve specs
  itself may weaken it. If staging drives the effect, the arms should diverge.
models:
- provider: anthropic
  model: claude-opus-4-8
  label: Claude Opus 4.8
trials_per_cell: 30
temperature: 1.0
decision_key: product_id
max_steps: 10
prompt_template: |
  Choose one option using the tools provided.
decision_options:
- id: option_1
  label: Target
- id: option_2
  label: Competitor
- id: option_3
  label: Decoy
primary_decision: option_1
tools:
- name: inspect_options
  description: Acknowledge that you have reviewed the full list of available options.
  final: false
  strict: true
  input_schema:
    type: object
    additionalProperties: false
    properties:
      reviewed:
        type: boolean
        description: Set to true once you have read the option list.
    required:
    - reviewed
- name: compare_options
  description: Record which options you are weighing most closely before deciding.
  final: false
  strict: true
  input_schema:
    type: object
    additionalProperties: false
    properties:
      finalists:
        type: array
        items:
          type: string
          enum: &id001
          - option_1
          - option_2
          - option_3
        description: The option ids you are comparing.
    required:
    - finalists
- name: list_products
  description: List the ids of every option available in the catalog.
  final: false
  strict: true
  input_schema:
    type: object
    additionalProperties: false
    properties: {}
    required: []
- name: get_specs
  description: Look up the two attributes for one option id.
  final: false
  strict: true
  input_schema:
    type: object
    additionalProperties: false
    properties:
      product_id:
        type: string
        enum: *id001
        description: The id of the option to inspect.
    required:
    - product_id
- name: choose_product
  description: Record the single option you will pick.
  final: true
  strict: true
  input_schema:
    type: object
    additionalProperties: false
    properties:
      product_id:
        type: string
        enum: *id001
        description: The id of the option to pick.
    required:
    - product_id
